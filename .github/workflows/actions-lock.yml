---
name: Verify action lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install action lockfile tool
        run: gh extension install github/gh-actions-lock
      - name: Verify action dependencies
        run: gh actions-lock --verify
