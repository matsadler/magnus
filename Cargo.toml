[package]
name = "magnus"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "High level Ruby bindings. Write Ruby extension gems in Rust, or call Ruby code from a Rust binary."
keywords = ["ruby", "rubygem", "extension", "gem"]
categories = ["api-bindings", "development-tools::ffi"]
repository = "https://github.com/matsadler/magnus"
documentation = "https://docs.rs/magnus/"
license = "MIT"
exclude = [".github", ".gitignore"]

[workspace]
members = ["magnus-macros"]
exclude = [
    "examples/rust_blank/ext/rust_blank",
    "examples/custom_exception_ruby/ext/ahriman",
    "examples/custom_exception_rust/ext/ahriman",
    "examples/complete_object/ext/temperature",
]

[features]
default = ["block", "debug", "fiber", "io", "mutex", "numeric", "process", "range", "r_complex", "r_file", "r_match", "r_rational", "r_regexp", "r_struct", "thread", "time", "typed_data"]
block = ["typed_data"]
bytes = ["dep:bytes"]
chrono = ["dep:chrono", "time"]
debug = ["typed_data"]
embed = ["rb-sys/link-ruby"]
fiber = ["typed_data"]
io = []
mutex = ["typed_data"]
numeric = []
process = []
range = ["r_struct"]
r_complex = []
r_file = []
r_match = []
r_rational = []
r_regexp = []
r_struct = []
rb-sys = []
thread = ["typed_data"]
time = ["typed_data"]
typed_data = []

[dependencies]
bytes = { version = "1", optional = true }
chrono = { version = "0.4.38", optional = true }
magnus-macros = { version = "0.9.1", path = "magnus-macros" }
rb-sys = { version = "0.9.124", default-features = false, features = [
    "bindgen-rbimpls",
    "bindgen-deprecated-types",
    "stable-api",
] }
seq-macro = "0.3"

[dev-dependencies]
magnus = { path = ".", features = [
    "embed",
    "rb-sys",
    "bytes",
    "chrono",
    "io",
] }
rb-sys = { version = "0.9.124", default-features = false, features = [
    "stable-api-compiled-fallback",
] }

[build-dependencies]
rb-sys-env = "0.2.3"

[lib]
doc-scrape-examples = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "fibonacci"
doc-scrape-examples = false

[[example]]
name = "hello_world"
doc-scrape-examples = false

[[example]]
name = "mut_point"
doc-scrape-examples = false

[[example]]
name = "point"
doc-scrape-examples = false
